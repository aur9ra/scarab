name: Windows behavior tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-behavior-tests:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Run album-directory resolver unit tests
        run: cargo test --lib album_directory
      - name: Run album-directory resolver integration tests
        run: cargo test --test album_directory
      - name: Run album-scope preparation unit tests
        run: cargo test --lib album_scope
      - name: Run configuration integration tests
        run: cargo test --test config
      - name: Run source-audio classifier unit tests
        run: cargo test --lib source_audio
      - name: Run required-discovery unit tests
        run: cargo test --lib required_discovery
      - name: Run candidate-inventory unit tests
        run: cargo test --lib candidate_inventory
      - name: Run candidate-inventory integration tests
        run: cargo test --test candidate_inventory
