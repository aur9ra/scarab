name: Windows behavior tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-behavior-tests:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Run directory-selector resolver unit tests
        run: cargo test --lib directory_selector
      - name: Run directory-selector resolver integration tests
        run: cargo test --test directory_selector
      - name: Run collection-scope preparation unit tests
        run: cargo test --lib collection_scope
      - name: Run configuration integration tests
        run: cargo test --test config
      # `config` alone also matches "configured" test names in other modules,
      # so we scope the filter to the config module's test submodule.
      - name: Run configuration unit tests
        run: cargo test --lib config::tests
      - name: Run metadata-selection unit tests
        run: cargo test --lib metadata_selection
      - name: Run VORBIS-comment projection unit tests
        run: cargo test --lib vorbis_comments
      - name: Run metadata-extraction-requirement unit tests
        run: cargo test --lib metadata_extraction_requirements
      - name: Run collection-membership unit tests
        run: cargo test --lib collection_membership
      - name: Run source-audio classifier unit tests
        run: cargo test --lib source_audio
      - name: Run required-discovery unit tests
        run: cargo test --lib required_discovery
      - name: Run observed-source-file-inventory unit tests
        run: cargo test --lib observed_source_file_inventory
      - name: Run observed-source-file-inventory integration tests
        run: cargo test --test observed_source_file_inventory
      - name: Run test-support unit tests
        run: cargo test --lib test_support
      - name: Run sandbox lifecycle integration tests
        run: cargo test --test sandbox_support
