name: Windows behavior tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-behavior-tests:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Run Windows behavior tests using PowerShell script
        shell: pwsh
        run: ./scripts/windows-behavior-tests.ps1
